

<!DOCTYPE html>
<html>
<head>
    <title>Email Phishing Detector</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        input { padding: 10px; width: 300px; }
        button { padding: 10px; background-color: blue; color: white; border: none; }
    </style>
</head>
<body>
    <h1>Email Phishing Detector</h1>
    <form method="POST">
        <input type="text" name="email" placeholder="Enter email text here" required>
        <button type="submit">Check Email</button>
    </form>
    {% if result %}
        <h2>Result: {{ result }}</h2>
    {% endif %}
</body>
</html>
